# 공공 API 공고를 매일 수집해 Supabase programs 테이블에 저장 (work.md 6장 "일 1회 증분 수집")
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions → New repository secret)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DATA_GO_KR_SERVICE_KEY
#
# 주의: schedule 은 기본 브랜치(main)에 이 파일이 있어야 동작합니다.
#       수동 실행은 Actions 탭 → "Collect programs" → Run workflow

name: Collect programs

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST (= 21:00 UTC). GitHub 사정으로 몇 분~수십 분 늦게 시작될 수 있음
  workflow_dispatch: {} # 수동 실행 버튼

# 같은 수집이 겹쳐 돌지 않게
concurrency:
  group: collect-programs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04 # ubuntu-latest 는 2026-10 부터 Ubuntu 26 으로 바뀌는 중이라 고정
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: back/requirements.txt

      # 값은 출력하지 않고 "설정됨/없음"만 확인 → 빠진 Secret 이 있으면 여기서 바로 실패
      - name: Check secrets
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATA_GO_KR_SERVICE_KEY; do
            if [ -n "${!name}" ]; then echo "✅ $name 설정됨"; else echo "❌ $name 없음 (Settings → Secrets and variables → Actions → Repository secrets 확인)"; missing=1; fi
          done
          exit $missing

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect K-Startup
        run: python -m collectors.kstartup

      # 이후 소스 추가 시 여기에 단계 추가 (온통청년, 기업마당)
